# lanes.yaml — the lane abstraction operators expose to clients (docs/04).
# A lane is a declarative chain: primary -> fallback[] (EXECUTION fallback, the
# in-chain next-model swap — distinct from the classification fallback that ends
# at `balanced`; principle 5). Each primary/fallback element is a model ALIAS
# (`provider/model`, resolved via providers.yaml) OR another lane name.
# `constraints` drives the Capability Filter (require_* gates).
#
# Validated by LanesConfigSchema (@helm/shared) at load time — invalid => the
# gateway refuses to boot (fail-closed, principle 2). `balanced` is REQUIRED: it
# is the terminal of the classification fallback.
#
# PROVIDER MIX (2026-07-10, GPT-5.6): quality lanes lead with the `openai-codex`
# SUBSCRIPTION channel (connect it in admin → Providers) and fall back to official
# OpenAI GPT-5.6 API aliases when OPENAI_API_KEY is configured. DeepSeek/OpenRouter/
# ZenMux remain static lower fallbacks so the lane degrades gracefully when Codex
# or OpenAI API is unavailable. An unconnected `openai-codex/*` candidate fails
# OPEN (Phase-0 back-fill / skip to the next fallback), never a 5xx. Each lane still
# ends in a `*/auto` tail fallback; those auto aliases are deliberately
# JSON-INCAPABLE (catalog jsonOutput:none), so a strict-JSON request prunes them and
# lands on a deterministic json-capable model (docs/02: `*/auto` only at the tail).

# —— quality/cost lanes ——
economy:
  purpose: Cheap and fast for simple tasks
  reasoning_effort: medium
  primary: openai-codex/gpt-5.6-luna
  fallback:
    - openai/gpt-5.6-luna
    - openai-codex/gpt-5.4-mini
    - anthropic/claude-haiku-4-5-20251001
    - deepseek/deepseek-v4-flash
    - openrouter/deepseek-v4-flash
    - openrouter/auto
    - zenmux/auto

balanced:
  purpose: Default quality/cost tradeoff (classification fallback terminal)
  reasoning_effort: medium
  primary: openai-codex/gpt-5.6-terra
  fallback:
    - openai/gpt-5.6-terra
    - anthropic/claude-sonnet-4-6
    - deepseek/deepseek-v4-pro
    - openrouter/deepseek-v4-pro
    - zenmux-anthropic/claude-sonnet-4.6
    - zenmux/auto
    - openrouter/auto

premium:
  purpose: Strong reasoning and high quality
  reasoning_effort: high
  primary: openai-codex/gpt-5.6-sol
  fallback:
    - openai/gpt-5.6-sol
    - anthropic/claude-opus-4-8
    - zenmux-anthropic/claude-opus-4.8
    - zenmux/gpt-5.5
    - balanced

# —— task lanes (named after detected task_type; the lane resolver maps a
#    classified task_type onto a same-named lane — docs/04) ——
coding:
  purpose: Coding-capable models for code generation / editing
  # GPT-5.6 Sol is the flagship coding/reasoning model. The legacy `*-codex` slugs
  # are not used here because the ChatGPT-account backend historically rejected them.
  reasoning_effort: high
  primary: openai-codex/gpt-5.6-sol
  fallback:
    - premium
    - balanced

json:
  purpose: Strict structured-output (JSON) responses
  # The capability filter discriminates by request shape against each candidate's
  # `jsonOutput` tier (none<object<schema): a json_OBJECT request is served cheaply by
  # the official-DeepSeek primary (jsonOutput:object); a strict json_SCHEMA request
  # PRUNES that primary (no_response_schema_support) and lands on the cheap, natively
  # schema-capable openrouter mirror (jsonOutput:schema), only then dropping through
  # balanced whose `*/auto` tail (jsonOutput:none) is pruned for any JSON request.
  primary: deepseek/deepseek-v4-flash
  fallback:
    - openrouter/deepseek-v4-flash
    - balanced
  constraints:
    require_json: true

vision:
  purpose: Multimodal / image understanding
  primary: zenmux-vertex/gemini-3.5-flash
  fallback:
    - premium
  constraints:
    require_vision: true

tool_use:
  purpose: Reliable function / tool calling
  reasoning_effort: high
  primary: openai-codex/gpt-5.6-sol
  fallback:
    - premium
  constraints:
    require_tools: true

# —— vendor-family lanes (targets of config/model-aliases.yaml) ——
# A client that pins a FIXED vendor model id (Claude Code's `claude-opus-4-8`, an
# SDK locked to `gpt-5.5`) has its `model` rewritten onto one of THESE lanes BEFORE
# routing (model-aliases.yaml glob -> lane). Each LEADS with the requested family's
# real model, so an explicit `claude-opus` lands on a Claude-Opus-led chain instead
# of the GPT-led `premium` lane, then degrades through the matching generic lane.
# The lane abstraction still holds (principle 6): the client never names a provider
# alias. Every chain inherits balanced's json-capable body + `*/auto` tail, so a
# strict-JSON request still lands deterministically (the auto aliases get pruned).
#
# The Claude lanes LEAD with the NATIVE Anthropic subscription alias (`anthropic/*`,
# the Claude Pro/Max OAuth pool — connect it in admin → Providers). Like the
# `openai-codex/*` primaries above, an unconnected `anthropic/*` candidate fails
# OPEN (skip to the next fallback), never a 5xx — so each lane is backed by a static
# `zenmux/*` key that keeps it serving without a subscription.
claude-opus:
  purpose: Anthropic Claude Opus tier — strongest Claude
  primary: anthropic/claude-opus-4-8
  fallback:
    # When the native OAuth pool is parked/absent, degrade into the GPT-led premium chain.
    - premium

# Claude Fable 5 — the Mythos-class Claude (autonomous knowledge work + coding),
# 1M context. Mirrors claude-opus: LEADS with the native Anthropic OAuth alias (an
# unconnected `anthropic/*` candidate fails OPEN to the next fallback) and degrades
# straight into the GPT-led `premium` chain. No static Fable mirror is wired, so
# without a Claude subscription this lane serves via `premium`.
claude-fable:
  purpose: Anthropic Claude Fable tier — Mythos-class autonomous work
  primary: anthropic/claude-fable-5
  fallback:
    - premium

claude-sonnet:
  purpose: Anthropic Claude Sonnet tier — balanced Claude
  primary: anthropic/claude-sonnet-4-6
  fallback:
    # Native Anthropic OAuth pool, degrading to the generic balanced lane when parked.
    - balanced

# Native Anthropic Haiku via the OAuth pool; degrades straight to `economy`
# (deepseek-flash) when the subscription is parked.
claude-haiku:
  purpose: Anthropic Claude Haiku tier — cheap/fast
  primary: anthropic/claude-haiku-4-5-20251001
  fallback:
    - economy

# GPT-5.6 family. The unsuffixed `gpt-5.6` alias routes to Sol upstream; Helm keeps
# an explicit lane so pinned clients get a GPT-5.6-led chain before generic premium.
"gpt-5.6":
  purpose: OpenAI GPT-5.6 alias — routes to Sol upstream
  primary: openai-codex/gpt-5.6
  fallback:
    - openai/gpt-5.6
    - gpt-5.6-sol

"gpt-5.6-sol":
  purpose: OpenAI GPT-5.6 Sol tier — flagship reasoning/coding
  reasoning_effort: high
  primary: openai-codex/gpt-5.6-sol
  fallback:
    - openai/gpt-5.6-sol
    - premium

"gpt-5.6-terra":
  purpose: OpenAI GPT-5.6 Terra tier — balanced intelligence/cost
  reasoning_effort: medium
  primary: openai-codex/gpt-5.6-terra
  fallback:
    - openai/gpt-5.6-terra
    - balanced

"gpt-5.6-luna":
  purpose: OpenAI GPT-5.6 Luna tier — efficient/high-volume
  reasoning_effort: medium
  primary: openai-codex/gpt-5.6-luna
  fallback:
    - openai/gpt-5.6-luna
    - economy

# Stays on GPT-5.5 ACROSS providers (Codex subscription -> static ZenMux key) before
# degrading to the GPT-led `premium` lane, so an explicit gpt-5.5 request is not
# bumped onto Claude Opus on the first hiccup.
"gpt-5.5":
  purpose: OpenAI GPT-5.5 tier
  primary: openai-codex/gpt-5.5
  fallback:
    - anthropic/claude-opus-4-8
    - premium

# GPT-5.4 — strong reasoning one tier below 5.5 ($2.5/$15 vs 5.5's $5/$30). Leads
# with the Codex subscription's real gpt-5.4. ZenMux exposes NO 5.4 static key, so
# it degrades to the GPT-led `premium` lane (gpt-5.5 -> static zenmux/gpt-5.5 ->
# Opus) rather than dropping straight to the cheap tier on the first hiccup.
"gpt-5.4":
  purpose: OpenAI GPT-5.4 tier — strong reasoning
  primary: openai-codex/gpt-5.4
  fallback:
    - premium

# GPT-5.4-mini — the cheap/fast GPT tier ($0.75/$4.5). Leads with the Codex
# subscription's real gpt-5.4-mini, then degrades to `economy` (where this SAME
# model already sits as a fallback), keeping a mini request cheap instead of
# bumping it onto a premium model.
"gpt-5.4-mini":
  purpose: OpenAI GPT-5.4 mini tier — cheap/fast
  primary: openai-codex/gpt-5.4-mini
  fallback:
    - economy

# Google Gemini via ZenMux. Both tiers now LEAD with the NATIVE Gemini wire
# (`zenmux-vertex/*`, type: gemini) so a Gemini-CLI request (gemini inbound) is
# forwarded VERBATIM — native passthrough, no OpenAI-Chat IR round-trip (issue
# #217), so a Gemini-CLI request passes through verbatim. A cross-protocol caller
# (e.g. an OpenAI-Chat client pinning a gemini id) doesn't match the native target,
# so the `zenmux-vertex` provider's translated path serves it — the OpenAI-compat
# `zenmux/gemini-*` aliases (same upstream) were removed as redundant. gemini-3.1-pro
# is the latest Pro ZenMux serves; gemini-3.5-flash the latest GA Flash; both fully
# multimodal, degrading to the generic quality lane.
gemini-pro:
  purpose: Google Gemini Pro tier — strong multimodal reasoning
  primary: zenmux-vertex/gemini-3.1-pro
  fallback:
    - premium

gemini-flash:
  purpose: Google Gemini Flash tier — fast multimodal
  primary: zenmux-vertex/gemini-3.5-flash
  fallback:
    - balanced

# —— image-generation lanes (failover across image providers) ——
# Image gen (POST /v1/images/generations, POST /v1beta/interactions, and Gemini
# :generateContent on image models) is model-pinned per provider; group those
# per-provider aliases into a LANE and the dedicated image endpoints fail over across
# them exactly like a text lane (same circuit breaker + primary→fallback chain), for
# ANY key. Members MUST be image models (capabilities.outputImage) and SHOULD be a
# single kind — all OpenAI-Images (gpt-image-*) OR all Gemini (gemini-*-image) — so
# the verbatim request params are uniform across providers (a 4xx param-shape error is
# terminal and would mask a healthy fallback). Request the LANE NAME as `model`.
#
# Each lane LEADS with the DIRECT official upstream (providers.yaml: openai / google,
# needing OPENAI_API_KEY / GEMINI_API_KEY) and falls over to the ZenMux relay. With
# no official key set, the official primary is unavailable and the lane serves from
# the relay leg. See docs/05 (image generation) + README.
gpt-image:
  purpose: OpenAI gpt-image-2 — official primary, ZenMux fallback
  primary: openai/gpt-image-2
  fallback:
    - gpt-image-2

gemini-image:
  purpose: Gemini image — Google official → ZenMux Vertex flash → ZenMux pro
  primary: google/gemini-3.1-flash-image
  fallback:
    - gemini-3.1-flash-image
    - gemini-3-pro-image
