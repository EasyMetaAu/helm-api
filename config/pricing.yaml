# NATIVE Claude Pro/Max SUBSCRIPTION aliases (the `anthropic/*` OAuth pool — the
# claude-* lanes' primaries). A flat-fee subscription has no per-request bill, so
# these are IMPUTED API-equivalent rates (cost telemetry only — pricing never drives
# selection) so subscription traffic shows real $ in the dashboard instead of "—".
# Generated catalog has no entry for these models (only old claude-3-5-*), so per the
# "API price first, else official" rule these use OFFICIAL Anthropic list prices.
# cache_read = 0.1x input, cache_write (5-min) = 1.25x input — verified against the
# official Anthropic pricing page on 2026-07-02 (Fable 5: $10/M input, $50/M
# output, $1/M cache hit, $12.50/M 5-min cache write). Load-bearing: Claude Code
# caches heavily, and without these computeCostUsd bills cached tokens at full
# input rate (large over-estimate). MUST stay in sync with the capabilities.yaml caps.
anthropic/claude-opus-4-8:
  inputPerMTokUsd: 5.0
  outputPerMTokUsd: 25.0
  cacheReadPerMTokUsd: 0.5
  cacheWritePerMTokUsd: 6.25
anthropic/claude-sonnet-4-6:
  inputPerMTokUsd: 3.0
  outputPerMTokUsd: 15.0
  cacheReadPerMTokUsd: 0.3
  cacheWritePerMTokUsd: 3.75
# Official Claude API-equivalent estimate for Pro/Max subscription traffic.
# Introductory pricing is effective through 2026-08-31; Anthropic lists the
# standard price from 2026-09-01 as $3 input / $15 output / $0.30 cache read /
# $3.75 5-minute cache write per MTok.
# https://platform.claude.com/docs/en/about-claude/pricing
anthropic/claude-sonnet-5:
