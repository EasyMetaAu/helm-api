# model-aliases.yaml — virtual model map (docs/04 compatibility shim).
#
# A flat map of an inbound VENDOR model id -> a LANE name (config/lanes.yaml) or
# the "auto" sentinel. Clients that send a FIXED model id (Claude Code's
# `claude-opus-4-8`, an SDK pinned to a vendor model) don't know Helm's lanes or
# provider aliases — so their `model` field is rewritten onto a lane BEFORE
# routing, and they stop getting `400 unknown model`.
#
# WHY a lane (not a provider model): Helm exposes the LANE abstraction, never the
# model market (principle 6). A virtual id maps to a lane and keeps the lane's full
# fallback chain + failover. Honoring a pinned vendor id is a CUSTOM-MODEL feature:
# the rewrite applies ONLY to keys with `allow_custom_model: true`. A key WITHOUT it
# routes EVERYTHING through classification (auto) — the model field is ignored, never
# a 400. A key's `allowed_lanes` whitelist still clamps the rewritten lane.
#
# MATCHING: an exact key wins; otherwise the matching `*`-glob with the most
# literal characters wins (so `claude-opus-*` beats `claude-*` regardless of
# order). `*` = any run of chars (incl. empty) — it absorbs the date suffix Claude
# Code appends (`claude-opus-4-8-20260115`). Case-sensitive.
#
# FAIL-CLOSED (principle 2): every target must be a configured lane or "auto", or
# the gateway refuses to boot. This file is OPTIONAL — delete it for no rewrite.
#
# NOTE: only BARE vendor ids are matched here. Internal provider aliases are
# `provider/model` (e.g. `zenmux-anthropic/claude-opus-4.8`), which never start
# with `claude`/`gpt`, so an allow_custom_model key can still address them directly.

# ── Anthropic / Claude Code ──────────────────────────────────────────────────
# Claude Code sends two classes: the main model and a small/fast background model
# (ANTHROPIC_SMALL_FAST_MODEL, usually Haiku). Each Claude family maps to its
# DEDICATED vendor-family lane (config/lanes.yaml) so the request leads with that
# family's real model and keeps its full fallback chain. Tip: you can also just set
# ANTHROPIC_MODEL=auto in Claude Code to let Helm's classifier pick per request.
"claude-3-5-haiku": claude-haiku
"claude-3-5-haiku-*": claude-haiku # dated id, e.g. claude-3-5-haiku-20241022
"claude-haiku-*": claude-haiku
"claude-opus-*": claude-opus
"claude-sonnet-*": claude-sonnet
"claude-fable-*": claude-fable # Mythos-class Claude (claude-fable-5[-date])
"claude-*": balanced # catch-all for any other / future Claude id

# ── OpenAI-compatible clients (Codex, Cursor, …) ─────────────────────────────
# Bare GPT ids → lanes (config/lanes.yaml). Each named family maps to its DEDICATED
# vendor-family lane so the request LEADS with that family's real model; the `-*`
# globs absorb any dated/suffixed id. The cheap `gpt-5.4-mini` needs its OWN mapping
# (it is more literal than `gpt-5*`, so longest-literal-wins routes it to the cheap
# lane, NOT the expensive `premium` catch-all). Comment these out if you don't front
# any GPT clients.
"gpt-5.5": gpt-5.5
"gpt-5.4-mini": gpt-5.4-mini
"gpt-5.4-mini-*": gpt-5.4-mini
"gpt-5.4": gpt-5.4
"gpt-5.4-*": gpt-5.4
"gpt-5-codex": coding
"gpt-5*": premium
"gpt-*": balanced

# ── Google Gemini (Gemini CLI, AI Studio / Vertex SDKs, …) ───────────────────
# Bare Gemini ids → vendor-family lanes (config/lanes.yaml). The cheap `*flash-lite*`
# tier routes straight to the `economy` lane (no dedicated model); any other `*flash*`
# leads with the Gemini Flash tier; any `*pro*` with the Gemini Pro tier; the bare
# `gemini-*` catch-all degrades to balanced. Longest-literal wins, so `gemini-*flash-lite*`
# (17 literal chars) beats `gemini-*flash*` (12) beats `gemini-*pro*` (10) beats the
# `gemini-*` catch-all (7) — declaration order is irrelevant. The middle `*` absorbs the
# version, so a future 3.2/4 flash-lite needs no edit; the trailing `*` absorbs any
# `-preview` / `-latest` / date suffix (gemini-3.1-flash-lite, gemini-3.5-flash, …).
# Image-generation ids route to the dedicated image lanes. Longest-literal wins, so
# `gemini-*flash-image*` (18) beats the text `gemini-*flash*` (12) and `gemini-*pro-image*`
# (16) beats `gemini-*pro*` (10) — a `*-image` id is never swallowed by a text lane.
"gemini-*flash-image*": gemini-flash-image
"gemini-*pro-image*": gemini-pro-image
"gemini-*flash-lite*": economy
"gemini-*flash*": gemini-flash
"gemini-*pro*": gemini-pro
"gemini-*": balanced
