name: CI

on:
  # Keep the workflow definition under default-branch control. The test jobs
  # explicitly check out the PR merge ref below, on disposable hosted runners.
  pull_request_target:
  push:
    branches: [main]

# Jobs that execute repository code inherit this read-only permission. Only the
# checkout-free reporter below narrows its own token to `checks: write`.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  # Every Action is pinned to an audited full SHA and uses a Node 22 runtime.
  # The persistent runner pool is on 2.335.1 (newer than the required 2.329.0).
  # checkout v7's fork-PR opt-in is scoped to pull_request_target jobs below;
  # those jobs run only on disposable hosted runners with a read-only token.
  verify:
    # Bound a genuinely stuck verify run; GitHub's default is six hours.
    timeout-minutes: 10
    # Keep the broad unit suite off the shared self-hosted machine: concurrent
    # runner processes there can consume this job's entire bounded runtime.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify PR merge ref matches event head
        if: github.event_name == 'pull_request_target'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          read -r base_sha actual_head_sha extra_parent <<<"$(git show -s --format='%P' HEAD)"
          if [[ -z "${base_sha}" || -z "${actual_head_sha}" || -n "${extra_parent}" || "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::PR merge ref does not match the event head SHA"
            exit 1
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # The self-hosted Docker runners keep /home/runner/_work on a host
          # volume. Do not use actions/cache here: it re-downloads a ~245MB pnpm
          # cache from GitHub on every run and costs 2+ minutes on 199.4.
          package-manager-cache: false
      - name: Use persistent pnpm store on runner
        if: github.event_name == 'push'
        run: pnpm config set store-dir /home/runner/_work/.pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # build BEFORE test: admin-static.test.ts serves apps/admin/build, which is
      # gitignored and therefore absent on a fresh CI checkout (would 404 → test fail).
      - run: pnpm build
      # Keep PGlite-backed Store tests on two workers without slowing every
      # unrelated unit test to the same concurrency.
      - run: pnpm test:ci:fast
        timeout-minutes: 7

  # PGlite starts an in-process WASM Postgres and runs migrations for each fresh
  # database. Isolate every Store test on a fresh hosted runner so it cannot
  # contend with unrelated jobs on the persistent runner pool.
  store:
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify PR merge ref matches event head
        if: github.event_name == 'pull_request_target'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          read -r base_sha actual_head_sha extra_parent <<<"$(git show -s --format='%P' HEAD)"
          if [[ -z "${base_sha}" || -z "${actual_head_sha}" || -n "${extra_parent}" || "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::PR merge ref does not match the event head SHA"
            exit 1
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Use persistent pnpm store on runner
        if: github.event_name == 'push'
        run: pnpm config set store-dir /home/runner/_work/.pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci:store
        timeout-minutes: 6

  # End-to-end (Playwright) gate. Independent of `verify`/`docker` (no `needs`) so
  # the jobs run in parallel and don't block one another. The e2e webServers run
  # the gateway via tsx against SOURCE + a fully offline deterministic mock
  # upstream (no network, fixed worker interval), so the suite is hermetic. Only
  # admin.spec drives a real browser; the rest use Playwright's HTTP request
  # context. GitHub-hosted pull-request runners already provide Chromium's system
  # libraries, so avoid the slow apt step; trusted main pushes retain the
  # preconfigured self-hosted pool.
  e2e:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(github.event_name == 'pull_request_target' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","docker"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify PR merge ref matches event head
        if: github.event_name == 'pull_request_target'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          read -r base_sha actual_head_sha extra_parent <<<"$(git show -s --format='%P' HEAD)"
          if [[ -z "${base_sha}" || -z "${actual_head_sha}" || -n "${extra_parent}" || "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::PR merge ref does not match the event head SHA"
            exit 1
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Use persistent pnpm store on runner
        if: github.event_name == 'push'
        run: pnpm config set store-dir /home/runner/_work/.pnpm-store
      - run: pnpm install --frozen-lockfile
      # The e2e webServer runs the gateway via tsx, which resolves @helm/core and
      # @helm/shared to their built dist (not src) — a fresh checkout has none, so
      # build first. admin.spec also serves apps/admin/build.
      - run: pnpm build
      - name: Install Playwright Chromium (admin.spec drives a real browser)
        run: PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/helm-playwright" pnpm --filter @helm/gateway exec playwright install chromium
      - run: PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/helm-playwright" pnpm test:e2e

  # Builds and smoke-tests the real gateway Docker image (docs/10). Kept fully
  # independent of `verify` (no `needs`) so the unit gates run on their own and
  # neither job blocks the other.
  docker:
    # Cold self-hosted builds have twice spent ~8 minutes inside pnpm's bounded
    # npm-registry retries before the image could reach its smoke-test steps.
    timeout-minutes: 12
    runs-on: ${{ fromJSON(github.event_name == 'pull_request_target' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","docker"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify PR merge ref matches event head
        if: github.event_name == 'pull_request_target'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          read -r base_sha actual_head_sha extra_parent <<<"$(git show -s --format='%P' HEAD)"
          if [[ -z "${base_sha}" || -z "${actual_head_sha}" || -n "${extra_parent}" || "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::PR merge ref does not match the event head SHA"
            exit 1
          fi
      - name: Build gateway image
        # Inject build info (docs/10) so GET /version reports real values instead
        # of "unknown": app version from package.json, the commit, and a UTC stamp.
        run: |
          docker build -t helm-api:ci \
            --build-arg HELM_VERSION="$(node -p "require('./package.json').version")" \
            --build-arg HELM_GIT_SHA="$(git rev-parse --short HEAD)" \
            --build-arg HELM_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .
      - name: Run container with required env
        # The provider credential is referenced by env NAME only (principle 7);
        # /healthz never calls upstream, so a dummy value is enough to boot. Config
        # is baked into the image (see Dockerfile) — no host bind-mount, which would
        # not resolve against the self-hosted runner's Docker daemon (DinD).
        run: |
          docker rm -f helm-ci 2>/dev/null || true
          docker run -d --name helm-ci \
            -p 8080:8080 \
            -e DEEPSEEK_API_KEY=sk-ci-smoke-test \
            helm-api:ci
      - name: Wait for /healthz to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::gateway did not become healthy within 30s"
          docker logs helm-ci
          exit 1
      - name: Verify /version reports injected build info
        # Guards the build-arg wiring above: a regression that drops the args
        # would make /version fall back to "unknown" and fail here.
        run: |
          body=$(curl -fsS http://127.0.0.1:8080/version)
          echo "$body"
          expected=$(node -p "require('./package.json').version")
          echo "$body" | grep -q "\"version\":\"${expected}\"" \
            || { echo "::error::/version did not report injected version ${expected}"; exit 1; }
          echo "$body" | grep -q '"gitSha":"unknown"' \
            && { echo "::error::/version gitSha was not injected"; exit 1; } || true
      - name: Stop container
        if: always()
        continue-on-error: true
        run: docker stop helm-ci && docker rm helm-ci

  # The four jobs above execute untrusted PR code with a read-only token. This
  # separate default-branch-controlled job never checks out or executes PR code;
  # it is the only job allowed to publish stable required checks on the PR head.
  report_pr_checks:
    if: always() && github.event_name == 'pull_request_target'
    needs: [verify, store, e2e, docker]
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    steps:
      - name: Report PR-head quality gates
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          STORE_RESULT: ${{ needs.store.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail

          publish_check() {
            local name="$1"
            local result="$2"
            local conclusion

            case "${result}" in
              success) conclusion="success" ;;
              failure) conclusion="failure" ;;
              cancelled) conclusion="cancelled" ;;
              *) conclusion="failure" ;;
            esac

            payload=$(jq -n \
              --arg name "${name}" \
              --arg head_sha "${HEAD_SHA}" \
              --arg conclusion "${conclusion}" \
              --arg summary "CI job result: ${result}" \
              '{name: $name, head_sha: $head_sha, status: "completed", conclusion: $conclusion, output: {title: $name, summary: $summary}}')

            curl --fail-with-body --retry 3 \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/check-runs" \
              --data "${payload}"
          }

          publish_check "PR / verify" "${VERIFY_RESULT}"
          publish_check "PR / store" "${STORE_RESULT}"
          publish_check "PR / e2e" "${E2E_RESULT}"
          publish_check "PR / docker" "${DOCKER_RESULT}"

  # Organization policy retains this legacy aggregate context. Keep it as a
  # checkout-free summary of the four distinct gates instead of duplicating their
  # repository-code work. On PRs it also requires the trusted PR-head reporter;
  # on main pushes that reporter is intentionally skipped.
  core_ci:
    name: Core CI
    if: always()
    needs: [verify, store, e2e, docker, report_pr_checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every essential CI boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          STORE_RESULT: ${{ needs.store.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          REPORT_RESULT: ${{ needs.report_pr_checks.result }}
        run: |
          set -euo pipefail

          [[ "${VERIFY_RESULT}" == "success" ]] || { echo "::error::verify: ${VERIFY_RESULT}"; exit 1; }
          [[ "${STORE_RESULT}" == "success" ]] || { echo "::error::store: ${STORE_RESULT}"; exit 1; }
          [[ "${E2E_RESULT}" == "success" ]] || { echo "::error::e2e: ${E2E_RESULT}"; exit 1; }
          [[ "${DOCKER_RESULT}" == "success" ]] || { echo "::error::docker: ${DOCKER_RESULT}"; exit 1; }

          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            [[ "${REPORT_RESULT}" == "success" ]] || { echo "::error::report_pr_checks: ${REPORT_RESULT}"; exit 1; }
          else
            [[ "${REPORT_RESULT}" == "skipped" ]] || { echo "::error::unexpected report_pr_checks result: ${REPORT_RESULT}"; exit 1; }
          fi
