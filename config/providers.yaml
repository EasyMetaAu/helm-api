# Upstream providers (providers-multi). Credentials are referenced by env var
# NAME only (api_key_env) — never a plaintext key in the repo (docs/10,
# principle 7). lane/policy reference only the internal ALIAS; `provider_model`
# is the provider's real id and an internal supply-chain detail (principle 6).
#
# ─────────────────────────────────────────────────────────────────────────────
# ALIAS-NAMESPACE ALIGNMENT (2026-05-31, task config-align — see
# implementation-notes). Everything is now keyed by ONE universal alias of the
# form `provider/model` (borrowed from the sibling llm-router project's
# conventions): the SAME string is the key across providers (here), lanes
# (config/lanes.yaml candidates), the capability+pricing catalog
# (packages/core/src/catalog/generated/catalog.json), and pricing overrides.
#
#   alias  ==  catalog modelKey  ==  pricing key      (the ROUTING key)
#   provider_model  =  the provider's REAL upstream model id (what we send)
#
# REVERSED 2026-05-31 (task fix-upstream-model-id — see implementation-notes):
# alias and provider_model are NOT equal. The earlier "align everything to the
# prefixed alias" convention sent the prefixed string (e.g. `deepseek/deepseek-v4-
# flash`) upstream as `model`, but a provider only knows the BARE id
# (`deepseek-v4-flash`) — an unknown model makes the upstream return a 4xx/5xx. The
# executor (apps/gateway/src/routes/execute.ts) sends the RESOLVED `provider_model`
# upstream verbatim, so it MUST be the real bare id. The alias keeps the prefixed
# `provider/model` form because it is the routing key (lanes candidates, decision
# record, catalog/pricing lookup). To pin a lane to a different upstream id, change
# only that entry's `provider_model` (no code change; principle 2, config-as-code).
#
# Unified shape (HelmConfigSchema.ProviderConfig): name, type (openai|anthropic),
# base_url?, api_key_env (env-var NAME), models[] { alias -> provider_model }.
# OpenAI-compatible providers that reject OpenAI's newer `developer` role can set
# map_developer_role_to_system: true as a provider-scoped compatibility shim.
# A duplicate alias across providers is rejected at build time (fail-closed,
# principle 2). The test/e2e harness overrides every provider's base_url via
# HELM_PROVIDER_BASE_URL so the mock upstream serves all of them.
#
# ─────────────────────────────────────────────────────────────────────────────
# PRIMARY = official DeepSeek; premium/coding lanes route through the openai-codex
# SUBSCRIPTION channel (2026-06-03, task drop-openai-crs-relay). The former
# self-built `openai-crs` relay (la.atmy.work) was deleted: it WAS just a proxy in
# front of a ChatGPT/Codex subscription, which Helm now connects natively via the
# built-in `openai-codex` OAuth preset (admin → Providers → Connect). That preset
# is SYNTHESIZED at runtime — it exposes its models as `openai-codex/<model>`
# aliases keyed by the OAuth provider id — so it must NOT be declared as a static
# provider here, or the duplicate alias would fail-closed. Lanes may reference
# `openai-codex/*` even before a subscription is connected: an unconnected alias
# fails OPEN (Phase-0 back-fill / skip to the next fallback), never a 5xx.
providers:
  # PRIMARY provider (providers[0]). Backs the default path, the Layer-2 eval
  # call, and the Phase-0 passthrough; its credential (DEEPSEEK_API_KEY) is
  # mandatory (fail-closed if unset). Official DeepSeek OpenAI-compatible API
  # (https://api.deepseek.com). alias == catalog/pricing key; provider_model is
  # the real upstream id sent on the wire.
  - name: deepseek
    type: openai
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    # Official DeepSeek rejects `messages[].role="developer"` with HTTP 400; map
    # it to `system` before the upstream call while preserving true OpenAI/Codex.
    map_developer_role_to_system: true
    models:
      # deepseek-v4-pro — balanced/default primary, json-capable, big context.
      - alias: deepseek/deepseek-v4-pro
        provider_model: deepseek-v4-pro
      # deepseek-v4-flash — economy/cheap + the Layer-2 eval small-model, json-capable.
      - alias: deepseek/deepseek-v4-flash
        provider_model: deepseek-v4-flash
      # NOTE: the Layer-2 eval small-model is NOT a registry alias. The eval client
      # (classifier.yaml `eval.model`) bypasses the registry and sends its id
      # directly on the wire to THIS primary provider's base_url; it is
      # `deepseek-v4-flash` (a real DeepSeek id), priced for eval_usd via the bare
      # `deepseek-v4-flash` key in pricing.yaml.

  # SECONDARY provider — ZenMux aggregator. A genuinely DIFFERENT upstream with
  # its own credential, proving a fallback chain can CROSS providers. Carries the
  # vision-capable model used by the `vision` task lane plus a json-INCAPABLE
  # auto-route fallback.
  - name: zenmux
    type: openai
    base_url: https://zenmux.ai/api/v1
    api_key_env: ZENMUX_API_KEY
    models:
      # anthropic/claude-opus-4.7 — premium fallback, vision+json (zenmux real id).
      - alias: zenmux/claude-opus-4.7
        provider_model: anthropic/claude-opus-4.7
      # anthropic/claude-sonnet-4.6 — balanced fallback, vision+json (zenmux real id).
      - alias: zenmux/claude-sonnet-4.6
        provider_model: anthropic/claude-sonnet-4.6
      # openai/gpt-5.5 — premium fallback when no Codex subscription is connected
      # (zenmux real id).
      - alias: zenmux/gpt-5.5
        provider_model: openai/gpt-5.5
      # google/gemini-3.5-flash — vision lane primary (multimodal; zenmux real id).
      - alias: zenmux/gemini-3.5-flash
        provider_model: google/gemini-3.5-flash
      # auto — platform auto-route. JSON-INCAPABLE on purpose (see
      # catalog supports_json_schema:false): the capability filter skips it for
      # strict-JSON requests so the `json` lane prunes to a deterministic model.
      # Tail fallback only.
      - alias: zenmux/auto
        provider_model: auto

  # TERTIARY provider — OpenRouter aggregator. Final dual-platform auto-route
  # fallback. Its `*/auto` alias is likewise JSON-INCAPABLE (see catalog).
  - name: openrouter
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models:
      # deepseek/deepseek-v4-* — OpenRouter-hosted mirrors of the official
      # DeepSeek models; economy/balanced fallbacks when the primary is down.
      - alias: openrouter/deepseek-v4-pro
        provider_model: deepseek/deepseek-v4-pro
      - alias: openrouter/deepseek-v4-flash
        provider_model: deepseek/deepseek-v4-flash
      # real_model: openrouter/auto — platform auto-route, JSON-INCAPABLE. The
      # last-resort tail fallback shared by every lane.
      - alias: openrouter/auto
        provider_model: openrouter/auto

  # ─────────────────────────────────────────────────────────────────────────────
  # OAUTH SUBSCRIPTION PROVIDER (issue #38) — EXAMPLE, COMMENTED OUT.
  # For subscription / SSO upstreams that issue SHORT-LIVED OAuth access tokens
  # (Claude/ChatGPT subscriptions, enterprise SSO gateways), reference an `oauth`
  # block INSTEAD of `api_key_env`. Helm refreshes the token NON-INTERACTIVELY and
  # injects a dynamic Bearer per request. A provider must carry EXACTLY ONE of
  # `api_key_env` or `oauth` (fail-closed otherwise; principle 2).
  #
  # SECURITY (principle 7): every field below is an env var NAME — NEVER a plaintext
  # client id / secret / token. Set the actual values in the environment:
  #   PROVIDER_X_CLIENT_ID, PROVIDER_X_CLIENT_SECRET, PROVIDER_X_REFRESH_TOKEN.
  #
  # KNOWN LIMITATION (v1, see implementation-notes D3): the token cache is IN-MEMORY
  # only. A provider that ROTATES refresh tokens on each refresh will lose the
  # rotated token on a process restart; Helm then re-derives from the env value,
  # which fails if the upstream already retired it. A persistent TokenStore is a
  # follow-up. The interactive authorization_code (browser) flow is OUT OF SCOPE.
  #
  # - name: claude-subscription
  #   type: openai
  #   base_url: https://example-subscription.test/v1
  #   oauth:
  #     grant: refresh_token            # refresh_token (default) | client_credentials
  #     token_url: https://example-subscription.test/oauth/token
  #     client_id_env: PROVIDER_X_CLIENT_ID
  #     client_secret_env: PROVIDER_X_CLIENT_SECRET
  #     refresh_token_env: PROVIDER_X_REFRESH_TOKEN   # required for refresh_token grant
  #     scopes: []                      # optional OAuth scopes
  #     # audience: https://example-subscription.test/api   # optional
  #   models:
  #     - alias: claude-subscription/opus
  #       provider_model: claude-opus
  #
  # client_credentials variant (machine-to-machine; no refresh_token needed):
  # - name: sso-gateway
  #   type: openai
  #   base_url: https://sso.example.test/v1
  #   oauth:
  #     grant: client_credentials
  #     token_url: https://sso.example.test/oauth/token
  #     client_id_env: SSO_CLIENT_ID
  #     client_secret_env: SSO_CLIENT_SECRET
  #     scopes: ["models.read"]
  #   models:
  #     - alias: sso-gateway/default
  #       provider_model: default-model
  #
  # ── SUBSCRIPTION PRESET OAuth (issue #38) — interactive login via the admin UI ──
  # These use a BUILT-IN provider (client id / endpoints / scopes baked in) and
  # store the (rotating) credential ENCRYPTED in the OAuthTokenStore — NOT env.
  # Requirements:
  #   1. Set HELM_OAUTH_ENC_KEY (32 bytes; base64 or 64 hex) — fail-closed if a
  #      preset is configured without it.
  #   2. Log in from the admin UI: Providers → Connect. Nothing to put in env here.
  # ⚠️ ToS: using a Claude/Copilot subscription via a third-party gateway may violate
  #   the provider's terms — you opt in (see README "OAuth subscription providers").
  #
  # Multi-account pool: connect SEVERAL accounts of one provider (Providers →
  # Connect) and Helm pools them. Per-account settings live ENCRYPTED in the DB
  # (config_kv), edited from the admin UI under Providers → Manage — NOT in this
  # file: which models each account exposes, an egress proxy (HTTP/HTTPS/SOCKS5)
  # so each account leaves from a distinct IP, and a schedule (priority — lower =
  # served first; round-robin within an equal priority; "parked" = kept connected
  # but out of rotation). The `account:` field below only names ONE account to
  # declare statically; the pool needs no YAML.
  #
  # Claude Pro/Max (native Anthropic executor — note `type: anthropic`):
  # - name: claude-pro
  #   type: anthropic
  #   base_url: https://api.anthropic.com
  #   oauth:
  #     provider: anthropic            # built-in preset (manual-paste browser login)
  #     # account: default             # optional; for multi-account installs
  #   models:
  #     - alias: claude/opus
  #       provider_model: claude-opus-4-6
  #
  # GitHub Copilot (OpenAI-compatible; device-code login):
  # - name: copilot
  #   type: openai
  #   oauth:
  #     provider: github-copilot
  #   models:
  #     - alias: copilot/gpt
  #       provider_model: gpt-4o
  #
  # ChatGPT Plus/Pro — Codex (browser login + paste redirect URL).
  # This is the default lane channel for premium/coding/tool_use (config/lanes.yaml
  # references openai-codex/gpt-5.5, openai-codex/gpt-5.4, openai-codex/gpt-5.4-mini
  # — the models the Codex subscription actually exposes). Just connect it in the
  # admin UI (Providers → Connect) — the pool is SYNTHESIZED and its models become
  # `openai-codex/<model>` aliases automatically; NO YAML needed.
  # Declare a static block ONLY to pin a custom alias to a specific upstream id:
  # - name: chatgpt-codex
  #   type: openai
  #   oauth:
  #     provider: openai-codex
  #   models:
  #     - alias: codex/gpt
  #       provider_model: gpt-5-codex
