# Manual capability overrides (layer 2). Keyed by modelKey.
# Manual entries ALWAYS WIN over the generated catalog (per-field).
# Only list fields you want to override; the rest fall through to generated.
# Validated by CapabilitiesOverrideSchema — illegal values fail-closed.
#
# Example: force-enable vision on a model the upstream catalog marks false,
# or register a brand-new self-hosted model the upstream doesn't know about.

# "openai/gpt-4o":
#   supportsVision: true

# "local/llama-3.1-70b":
#   supportsTools: true
#   jsonOutput: object
#   supportsVision: false
#   supportsStreaming: true
#   maxContextTokens: 131072
#   maxOutputTokens: 4096
#
# `jsonOutput` is an ORDERED tier (none < object < schema): `none` = no JSON mode
# (pruned for any JSON request); `object` = `response_format:{type:"json_object"}`
# only (official DeepSeek — json_schema 400s); `schema` = native strict structured
# output (`response_format:{type:"json_schema"}` / Anthropic output_format / Gemini
# responseSchema). A json_schema request prunes every candidate below `schema`.
#
# `modalities` (optional) lists the EXTRA input modalities a backend accepts beyond
# text + image (image is gated by supportsVision). Allowed values: audio, video,
# document. P7 capability-aware routing: a request carrying one of these is only
# routed to a backend advertising it, else it is skipped with an explicit reason
# (no_audio_support / no_video_support / no_document_support). Absent ⇒ none.
# "openai/gpt-4o-audio-preview":
#   modalities: [audio]
#
# `supportsCachedContent` (optional, default false) marks providers that accept
# Gemini/LiteLLM cached-content handles (`cached_content` / `cachedContent`). This
# is hard request context, not a cache-affinity hint, so fallback chains skip every
# candidate that does not advertise it.

# ─────────────────────────────────────────────────────────────────────────────
# SUBSCRIPTION / AGGREGATOR MODELS (drop-openai-crs-relay 2026-06-03). These live
# HERE (the manual override layer), NOT in the generated catalog: they are
# subscription + aggregator aliases the LiteLLM-sourced `pnpm sync:catalog`
# artifact cannot know about, so a sync would wipe them. Keyed by the routing
# ALIAS (== the catalog modelKey the executor looks up; see execute.ts).
#
# `openai-codex/*` are the ChatGPT/Codex SUBSCRIPTION models (synthesized at
# runtime when the subscription is connected — alias prefix == the OAuth provider
# id `openai-codex`). They go through the openai-responses executor (NOT the old
# stream-only relay), so no `requiresStreaming` constraint applies. `deepseek/*`
# are the official DeepSeek API models (providers[0]).
#
# Every curated Codex model (packages/core/src/provider/oauth/models.ts) needs a
# manual capability entry here because the subscription aliases are synthesized at
# runtime and do not exist in LiteLLM's generated catalog.
#
# xAI subscription aliases are also synthesized. Only the two models observed from
# the authenticated Grok CLI catalog and exercised by live Helm smokes are declared:
# tools + SSE work for both; Grok 4.5 accepts explicit reasoning effort, while
# Composer may emit internal reasoning but rejects an explicit reasoning_effort.
# Their effective context limits are 500k and 200k respectively. Grok 4.5 vision
# is enabled from a live subscription-proxy verification of native Responses
# `input_image`; Composer rejected the same wire shape. Unverified JSON and
# extra-media abilities stay explicitly disabled (fail closed). The
# output ceiling is unknown (`null`): the 512-token connectivity smoke is not an
# upstream limit, and the unverified 64k public-API fallback must not be borrowed.
# SuperGrok does not publish per-token subscription billing; pricing.yaml documents
# the public-API-equivalent estimate used for Grok 4.5 telemetry and key budgets.
xai/grok-4.5:
  supportsTools: true
  jsonOutput: none
  supportsVision: true
  supportsStreaming: true
  supportsCachedContent: false
  modalities: []
  reasoningEffort:
    openaiReasoning:
      supported: true
      levels: [low, medium, high]
  maxContextTokens: 500000
  maxOutputTokens: null
xai/grok-composer-2.5-fast:
  supportsTools: true
  jsonOutput: none
  supportsVision: false
  supportsStreaming: true
  supportsCachedContent: false
  modalities: []
  reasoningEffort:
    openaiReasoning:
      supported: false
  maxContextTokens: 200000
  maxOutputTokens: null
