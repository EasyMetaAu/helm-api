# policies.yaml — server-side routing policies (docs/04 "策略配置"). Operators
# customize routing WITHOUT touching client code. Each policy is a FIRST-MATCH
# rule: the policy engine walks the list top-to-bottom and the FIRST policy whose
# `match` fully holds (AND of every written field) wins. A policy must declare at
# least one action: pin a lane (`use_lane`) and/or restrict the candidate to a
# whitelist (`allowed_lanes`) and/or force reasoning effort (`reasoning_effort`).
# `.strict()`-validated by PoliciesConfigSchema (@helm/shared): a typo in a field
# name fails the gateway boot (fail-closed, principle 2).
#
# These are SAMPLES — adjust to your own lane set / org structure.

policies:
  - id: json_constrained_to_json_lane
    match:
      needs_json: true
    use_lane: json
  - id: coding_simple_to_economy
    match:
      task_type: coding
      complexity: simple
    use_lane: economy
  - match:
      task_type: coding
      complexity: medium
    use_lane: coding
    reasoning_effort: medium
  - id: coding_complex_to_coding_lane
    match:
      task_type: coding
      complexity: complex
    use_lane: coding
    reasoning_effort: high
  - id: math_simple_to_balanced
    match:
      task_type: math
      complexity: simple
    use_lane: balanced
  - id: math_complex_to_premium
    match:
      task_type: math
      complexity: complex
    use_lane: premium
  - id: chat_simple_to_economy
    match:
      task_type: chat
      complexity: simple
    use_lane: economy
  - id: chat_complex_to_premium
    match:
      task_type: chat
      complexity: complex
    use_lane: premium
  - id: security_complex_to_premium
    match:
      task_type: security
      complexity: complex
    use_lane: premium
  - match:
      complexity: simple
    use_lane: economy
  - match:
      complexity: medium
    use_lane: balanced
  - match:
      complexity: complex
    use_lane: premium
