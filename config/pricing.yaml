# NATIVE-protocol passthrough aliases (issue #217); the OpenAI-compat
# `zenmux/gemini-*` / `zenmux/claude-*` entries were removed. Cost is fail-open (a
# missing key only nulls cost_usd, never blocks); the flash-lite/haiku rates have no
# prior sibling — set to a safe estimate, verify against the ZenMux price sheet.
zenmux-vertex/gemini-3.5-flash:
  inputPerMTokUsd: 1.5
  outputPerMTokUsd: 9.0
zenmux-vertex/gemini-3.1-flash-lite:
  inputPerMTokUsd: 0.25 # ZenMux /v1/models pricings: flash-lite is ~6x cheaper than flash, NOT equal
  outputPerMTokUsd: 1.5
zenmux-vertex/gemini-3.1-pro:
  inputPerMTokUsd: 2.0
  outputPerMTokUsd: 12.0
# IMAGE models: Gemini bills the generated image as OUTPUT TOKENS (candidatesTokenCount,
# modality IMAGE) at a per-Mtok IMAGE rate, and helm sets completion_tokens =
# candidatesTokenCount — so outputPerMTokUsd = the ZenMux image rate yields the EXACT
# per-image cost (a 1K–2K image = 1120 tokens → flash $0.067, pro $0.134). Rates verified
# live on the ZenMux model pages 2026-06-28. outputPerMTokUsd is the IMAGE-output rate
# (these are image models; the marginal text-output rate — flash $3, pro $12 — is unused).
gemini-3.1-flash-image:
  inputPerMTokUsd: 0.5
  outputPerMTokUsd: 60.0
gemini-3-pro-image:
  inputPerMTokUsd: 2.0
  outputPerMTokUsd: 120.0
# OpenAI gpt-image-2 (ZenMux, verified live 2026-06-28): text input $5/M, image
# output $30/M. The generated image is billed as usage.output_tokens (image_tokens)
# → outputPerMTokUsd is the image rate. Worked example: a 1024 image = 196 output
# tokens → 196 × $30/M + 15 × $5/M ≈ $0.006.
gpt-image-2:
  inputPerMTokUsd: 5.0
  outputPerMTokUsd: 30.0
# OFFICIAL image providers (cross-provider failover). Same model = same rates as the
