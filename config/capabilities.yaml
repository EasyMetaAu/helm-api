# Manual capability overrides (layer 2). Keyed by modelKey.
# Manual entries ALWAYS WIN over the generated catalog (per-field).
# Only list fields you want to override; the rest fall through to generated.
# Validated by CapabilitiesOverrideSchema — illegal values fail-closed.
#
# Example: force-enable vision on a model the upstream catalog marks false,
# or register a brand-new self-hosted model the upstream doesn't know about.

# "openai/gpt-4o":
#   supportsVision: true

# "local/llama-3.1-70b":
#   supportsTools: true
#   supportsJsonMode: false
#   supportsVision: false
#   supportsStreaming: true
#   maxContextTokens: 131072
#   maxOutputTokens: 4096
#
# `modalities` (optional) lists the EXTRA input modalities a backend accepts beyond
# text + image (image is gated by supportsVision). Allowed values: audio, video,
# document. P7 capability-aware routing: a request carrying one of these is only
# routed to a backend advertising it, else it is skipped with an explicit reason
# (no_audio_support / no_video_support / no_document_support). Absent ⇒ none.
# "openai/gpt-4o-audio-preview":
#   modalities: [audio]

# ─────────────────────────────────────────────────────────────────────────────
# SUBSCRIPTION / AGGREGATOR MODELS (drop-openai-crs-relay 2026-06-03). These live
# HERE (the manual override layer), NOT in the generated catalog: they are
# subscription + aggregator aliases the LiteLLM-sourced `pnpm sync:catalog`
# artifact cannot know about, so a sync would wipe them. Keyed by the routing
# ALIAS (== the catalog modelKey the executor looks up; see execute.ts).
#
# `openai-codex/*` are the ChatGPT/Codex SUBSCRIPTION models (synthesized at
# runtime when the subscription is connected — alias prefix == the OAuth provider
# id `openai-codex`). They go through the openai-responses executor (NOT the old
# stream-only relay), so no `requiresStreaming` constraint applies. `deepseek/*`
# are the official DeepSeek API models (providers[0]).
#
# These three are EXACTLY the curated Codex set the subscription exposes
# (packages/core/src/provider/oauth/models.ts — the ChatGPT-account Codex backend
# 400s on legacy `*-codex`/`*-pro` slugs, verified live), so every exposed alias
# an operator can pick has a capability + pricing entry here.
openai-codex/gpt-5.5:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: true
  supportsStreaming: true
  maxContextTokens: 1050000
  maxOutputTokens: 128000
openai-codex/gpt-5.4:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: true
  supportsStreaming: true
  maxContextTokens: 400000
  maxOutputTokens: 128000
openai-codex/gpt-5.4-mini:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: true
  supportsStreaming: true
  maxContextTokens: 400000
  maxOutputTokens: 65536
deepseek/deepseek-v4-pro:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: false
  supportsStreaming: true
  maxContextTokens: 1048576
  maxOutputTokens: 384000
deepseek/deepseek-v4-flash:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: false
  supportsStreaming: true
  maxContextTokens: 1048576
  maxOutputTokens: 16384
# OpenRouter-hosted DeepSeek mirrors (lanes fallback f0d0cc6; data from
# https://openrouter.ai/api/v1/models, 2026-06-04 — tools + structured_outputs
# supported, text-only input).
openrouter/deepseek-v4-pro:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: false
  supportsStreaming: true
  maxContextTokens: 1048576
  maxOutputTokens: 384000
openrouter/deepseek-v4-flash:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: false
  supportsStreaming: true
  maxContextTokens: 1048576
  maxOutputTokens: 131072
zenmux/claude-opus-4.7:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: true
  supportsStreaming: true
  # Claude accepts PDF/text documents as input but not audio/video (P7 modality
  # routing). A document-bearing request only routes here when "document" is listed.
  modalities: [document]
  maxContextTokens: 1000000
  maxOutputTokens: 128000
zenmux/claude-sonnet-4.6:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: true
  supportsStreaming: true
  # Same document-input story as opus-4.7 (PDF/text, no audio/video).
  modalities: [document]
  maxContextTokens: 1000000
  maxOutputTokens: 128000
zenmux/gpt-5.5:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: true
  supportsStreaming: true
  # OpenRouter lists `file` input for gpt-5.5 (text+image+file->text).
  modalities: [document]
  maxContextTokens: 1050000
  maxOutputTokens: 128000
zenmux/gemini-3.5-flash:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: true
  supportsStreaming: true
  # Gemini is fully multimodal on input: audio, video, and documents (P7).
  modalities: [audio, video, document]
  maxContextTokens: 1048576
  maxOutputTokens: 65536
# */auto aggregators: JSON-INCAPABLE on purpose — the capability filter prunes
# them for strict-JSON requests so a json lane lands on a deterministic model.
zenmux/auto:
  supportsTools: true
  supportsJsonMode: false
  supportsVision: true
  supportsStreaming: true
  maxContextTokens: 200000
  maxOutputTokens: 8192
openrouter/auto:
  supportsTools: true
  supportsJsonMode: false
  supportsVision: true
  supportsStreaming: true
  maxContextTokens: 200000
  maxOutputTokens: 8192
