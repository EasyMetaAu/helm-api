# lanes.yaml — the lane abstraction operators expose to clients (docs/04).
# A lane is a declarative chain: primary -> fallback[] (EXECUTION fallback, the
# in-chain next-model swap — distinct from the classification fallback that ends
# at `balanced`; principle 5). Each primary/fallback element is a model ALIAS
# (`provider/model`, resolved via providers.yaml) OR another lane name.
# `constraints` drives the Capability Filter (require_* gates).
#
# Validated by LanesConfigSchema (@helm/shared) at load time — invalid => the
# gateway refuses to boot (fail-closed, principle 2). `balanced` is REQUIRED: it
# is the terminal of the classification fallback.
#
# PROVIDER MIX (2026-09-28, GPT-6): quality lanes lead with verified
# `openai-codex` SUBSCRIPTION slugs where the ChatGPT/Codex backend accepts them
# (connect it in admin → Providers). Official OpenAI GPT API aliases are deliberately
# absent from every shipped lane because their per-token cost is too high. They remain
# defined in providers/capabilities/pricing for explicit custom-model use. Helm routes
# Astra/Sol/Luna lanes to their concrete subscription slugs. DeepSeek/OpenRouter/ZenMux
# remain static lower fallbacks so lanes degrade gracefully when subscriptions
# are unavailable. An unconnected candidate
# fails OPEN (Phase-0 back-fill / skip to the next fallback), never a 5xx. Each
# lane still ends in a `*/auto` tail fallback; those auto aliases are deliberately
# JSON-INCAPABLE (catalog jsonOutput:none), so a strict-JSON request prunes them
# and lands on a deterministic json-capable model (docs/02: `*/auto` only at the
# tail).

# —— quality/cost lanes ——
economy:
  purpose: Cheap and fast for simple tasks
  reasoning_effort: medium
  primary: gpt-6-luna
  fallback:
    - claude-haiku
    - grok
    - openrouter/deepseek-v4-flash
    - openrouter/auto
    - zenmux/auto
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

balanced:
  purpose: Default quality/cost tradeoff (classification fallback terminal)
  reasoning_effort: medium
  primary: gpt-6-sol
  fallback:
    - claude-sonnet
    - grok
    - openrouter/deepseek-v4-pro
    - zenmux/auto
    - openrouter/auto
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

premium:
  purpose: Strong reasoning and high quality
  reasoning_effort: high
  primary: gpt-6-astra
  fallback:
    - grok
    - claude-opus
    - balanced
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

# —— GPT-6 model lanes: Astra → Sol → Luna ——
# Subscription first, then DeepSeek Responses and the matching quality tier.
gpt-6-astra:
  purpose: OpenAI GPT-6 Astra — flagship reasoning/coding
  primary: openai-codex/gpt-6-astra
  fallback:
    - deepseek-responses/deepseek-flash
    - premium
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

gpt-6-sol:
  purpose: OpenAI gpt-6-sol — complex coding and agentic workflows
  primary: openai-codex/gpt-6-sol
  fallback:
    - deepseek-responses/deepseek-flash
    - balanced
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

gpt-6-luna:
  purpose: OpenAI gpt-6-luna — efficient high-volume tasks
  primary: openai-codex/gpt-6-luna
  fallback:
    - deepseek-responses/deepseek-flash
    - economy
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

# —— task lanes (named after detected task_type; the lane resolver maps a
#    classified task_type onto a same-named lane — docs/04) ——
coding:
  purpose: Coding-capable models for code generation / editing
  # GPT-6 Astra is the flagship coding/reasoning model. The legacy `*-codex` slugs
  # are not used here because the ChatGPT-account backend historically rejected them.
  reasoning_effort: high
  primary: gpt-6-astra
  fallback:
    - premium
    - balanced
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

json:
  purpose: Strict structured-output (JSON) responses
  # The capability filter discriminates by request shape against each candidate's
  # `jsonOutput` tier (none<object<schema): a json_OBJECT request is served cheaply by
  # the official-DeepSeek primary (jsonOutput:object); a strict json_SCHEMA request
  # PRUNES that primary (no_response_schema_support) and lands on the cheap, natively
  # schema-capable openrouter mirror (jsonOutput:schema), only then dropping through
  # balanced whose `*/auto` tail (jsonOutput:none) is pruned for any JSON request.
  primary: gpt-6-sol
  fallback:
    - claude-sonnet
    - openrouter/deepseek-v4-flash
    - balanced
  constraints:
    require_json: true
    require_tools: false
    require_vision: false

vision:
  purpose: Multimodal / image understanding
  # Subscription-first: Sol has the best everyday quality/quota balance; Grok
  # image input has also been verified live. Claude subscriptions cover structured
  # and long-context vision without automatically invoking a paid ZenMux model.
  primary: gpt-6-sol
  fallback:
    - grok
    - claude-sonnet
    - claude-opus
  constraints:
    require_vision: true
    require_tools: false
    require_json: false

tool_use:
  purpose: Reliable function / tool calling
  reasoning_effort: medium
  primary: gpt-6-astra
  fallback:
    - premium
  constraints:
    require_tools: true
    require_json: false
    require_vision: false

# —— vendor-family lanes (targets of config/model-aliases.yaml) ——
# A client that pins a FIXED vendor model id (Claude Code's `claude-opus-4-8`, an
# SDK locked to `gpt-5.4`) has its `model` rewritten onto one of THESE lanes BEFORE
# routing (model-aliases.yaml glob -> lane). Each LEADS with the requested family's
# real model, so an explicit `claude-opus` lands on a Claude-Opus-led chain instead
# of the generic `premium` lane, then degrades through the matching generic lane.
# The lane abstraction still holds (principle 6): the client never names a provider
# alias. Every chain inherits balanced's json-capable body + `*/auto` tail, so a
# strict-JSON request still lands deterministically (the auto aliases get pruned).
#
# The Claude lanes LEAD with the NATIVE Anthropic subscription alias (`anthropic/*`,
# the Claude Pro/Max OAuth pool — connect it in admin → Providers). Like the
# `openai-codex/*` primaries above, an unconnected `anthropic/*` candidate fails
# OPEN (skip to the next fallback), never a 5xx. Opus and Fable degrade through
# `premium`; Sonnet and Haiku degrade through `balanced` and `economy` respectively.
claude-opus:
  purpose: Anthropic Claude Opus tier — strongest Claude
  primary: anthropic/claude-opus-5-5
  fallback:
    - anthropic/claude-opus-5
    - anthropic/claude-opus-4-8
    - anthropic/claude-opus-4-7
    - anthropic/claude-opus-4-6
    - premium
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

# Claude Fable 5.1 — the Mythos-class Claude (autonomous knowledge work + coding),
# 1M context. Mirrors claude-opus: LEADS with the native Anthropic OAuth alias (an
# unconnected `anthropic/*` candidate fails OPEN to the next fallback) and degrades
# straight into the generic `premium` chain. No static Fable mirror is wired, so
# without a Claude subscription this lane serves via `premium`.
claude-fable:
  purpose: Anthropic Claude Fable 5.1 tier — Mythos-class autonomous work
  primary: anthropic/claude-fable-5-1
  fallback:
    - anthropic/claude-fable-5
    - premium
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

claude-sonnet:
  purpose: Anthropic Claude Sonnet tier — balanced Claude
  primary: anthropic/claude-sonnet-5
  fallback:
    - balanced
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

# Keep pinned Haiku traffic on the Anthropic subscription, then degrade directly
# to `economy` without automatically invoking the paid ZenMux Haiku alias.
claude-haiku:
  purpose: Anthropic Claude Haiku tier — cheap/fast
  primary: anthropic/claude-haiku-4-5-20251001
  fallback:
    - economy
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

# DEEPSEEK RESPONSES RUNG (2026-09-17). Every GPT-family lane carries
# `deepseek-responses/*` directly, AFTER any sibling subscription slug but BEFORE the
# generic lane. Reason: these lanes serve Codex traffic, and a Codex-origin body
# (custom_tool_call + echoed reasoning) does NOT degrade well through the generic
# chain — `grok` is same-protocol but gets downgraded to translation, and the Claude
# rungs are cross-protocol and often skipped outright. `deepseek-responses` speaks
# openai_responses natively, so the verbatim body is forwarded byte-for-byte; it is
# the only STATIC (non-subscription) same-protocol rung in the config.
#
# ALWAYS `deepseek-flash`, never `deepseek-v4-pro` — flash is strictly better as a
# fallback, not merely cheaper (official pricing page, checked 2026-09-17):
#   • image input: flash YES, v4-pro NO. A vision request skipped the v4-pro rung
#     with `no_vision_support` in production, so the fallback silently did nothing.
#   • price: ~3.4x cheaper in and out (idle 1/4 vs 4.5/13.5 CNY per MTok).
#   • concurrency: 2500 vs 500.
#   • identical 1M context / 384K max output, tools + thinking on both.
# There is no tier where v4-pro wins, so no lane uses it.
#
# THIS RUNG WAS REVERTED ONCE (2026-09-17) AND RESTORED THE SAME DAY. Production
# Codex sessions rendered raw DeepSeek DSML markers as chat text —
#   <｜｜DSML｜｜ calls><｜｜DSML｜｜ invoke name="exec">…
# — a 200 / status completed that had executed NOTHING. The first diagnosis blamed
# the model ("does not speak the Codex tool protocol") and pulled the rung. That was
# wrong. Replaying the real 480-item transcript against the live endpoint isolated
# the actual trigger:
#
#   DeepSeek accepts `type: "custom"` tools ONLY when named `apply_patch`; any other
#   name is a hard 400 ("Unsupported custom tool: 'exec'."). A Codex code-mode client
#   drives everything through a custom tool named `exec`, so the tool could not be
#   declared — while the transcript still replayed 143 `custom_tool_call` items. Shown
#   a history of calls to a tool that is not on the menu, the model stops using the
#   protocol and types the call out in its own DSML notation instead.
#
# Reproduced 5/5 with tools absent, 0/6 with any tool declared — it is a
# declaration/transcript INCONSISTENCY, not a protocol incompatibility. The fix is
# the `translateUnsupportedCustomTools` request contract (see server.ts): the
# unsupported custom tools and their echoed calls are rewritten as single-string
# function tools on the way up, and the model's `function_call` answer is translated
# back to `custom_tool_call` on the way down. Verified live 3/3 clean on the exact
# transcript that used to leak.
#
# The lesson that still stands: same protocol (`openai_responses`) only guarantees
# the REQUEST parses, never that the RESPONSE follows the same tool semantics. Any
# new rung under a tool-driven client must be proven with a real tool ROUND TRIP on
# a real transcript — a single-turn text probe would have missed this in both
# directions (it showed a clean `function_call`, which is why the rung shipped, and
# it would never have shown the leak, which is why the diagnosis went wrong).
# Retired GPT-5.6 and GPT-5.4 lanes are removed. Legacy client ids map to
# GPT-6 tiers in model-aliases.yaml; historical pricing/capabilities remain.

# Google Gemini via ZenMux. Both tiers now LEAD with the NATIVE Gemini wire
# (`zenmux-vertex/*`, type: gemini) so a Gemini-CLI request (gemini inbound) is
# forwarded VERBATIM — native passthrough, no OpenAI-Chat IR round-trip (issue
# #217), so a Gemini-CLI request passes through verbatim. A cross-protocol caller
# (e.g. an OpenAI-Chat client pinning a gemini id) doesn't match the native target,
# so the `zenmux-vertex` provider's translated path serves it — the OpenAI-compat
# `zenmux/gemini-*` aliases (same upstream) were removed as redundant. gemini-3.1-pro
# is the latest Pro ZenMux serves; gemini-3.5-flash the latest GA Flash; both fully
# multimodal, degrading to the generic quality lane.
gemini-pro:
  purpose: Google Gemini Pro tier — strong multimodal reasoning
  primary: zenmux-vertex/gemini-3.1-pro
  fallback:
    - premium
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

gemini-flash:
  purpose: Google Gemini Flash tier — fast multimodal
  primary: zenmux-vertex/gemini-3.5-flash
  fallback:
    - balanced
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

grok:
  purpose: Stable Grok channel; update only this primary when Grok changes version
  primary: xai/grok-4.6
  fallback: []
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

grok-fast:
  purpose: Grok Build Fast channel — higher token prices for faster responses
  primary: xai/grok-4.7-build-fast
  fallback: []
  constraints:
    require_tools: false
    require_json: false
    require_vision: false


# —— image-generation lanes (failover across image providers) ——
# Image gen (POST /v1/images/generations, POST /v1beta/interactions, and Gemini
# :generateContent on image models) is model-pinned per provider; group those
# per-provider aliases into a LANE and the dedicated image endpoints fail over across
# them exactly like a text lane (same circuit breaker + primary→fallback chain), for
# ANY key. Members MUST be image models (capabilities.outputImage) and SHOULD be a
# single kind — all OpenAI-Images (gpt-image-*) OR all Gemini (gemini-*-image) — so
# the verbatim request params are uniform across providers (a 4xx param-shape error is
# terminal and would mask a healthy fallback). Request the LANE NAME as `model`.
#
# `gpt-image` deliberately uses only the ZenMux relay because official OpenAI is
# excluded from shipped lanes for cost. `gemini-image` still leads with Google direct
# and falls over to ZenMux. See docs/05 (image generation) + README.
gpt-image:
  purpose: OpenAI gpt-image-2 through ZenMux relay — official API excluded for cost
  primary: openai-codex/gpt-image-2
  fallback: []
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

gemini-image:
  purpose: Gemini image — Google official → ZenMux Vertex flash → ZenMux pro
  primary: google/gemini-3.1-flash-image
  fallback:
    - gemini-3.1-flash-image
    - gemini-3-pro-image
  constraints:
    require_tools: false
    require_json: false
    require_vision: false

# Grok CLI sends these bare ids. Each lane pins the corresponding synthesized
# SuperGrok OAuth alias and deliberately has no cross-provider fallback: media
# create is a paid single-write operation.
grok-imagine-image-quality:
