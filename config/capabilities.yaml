# Manual capability overrides (layer 2). Keyed by modelKey.
# Manual entries ALWAYS WIN over the generated catalog (per-field).
# Only list fields you want to override; the rest fall through to generated.
# Validated by CapabilitiesOverrideSchema — illegal values fail-closed.
#
# Example: force-enable vision on a model the upstream catalog marks false,
# or register a brand-new self-hosted model the upstream doesn't know about.

# "openai/gpt-4o":
#   supportsVision: true

# "local/llama-3.1-70b":
#   supportsTools: true
#   supportsJsonMode: false
#   supportsVision: false
#   supportsStreaming: true
#   maxContextTokens: 131072
#   maxOutputTokens: 4096

# ─────────────────────────────────────────────────────────────────────────────
# RELAY / SELF-HOSTED MODELS (fix-upstream-model-id+catalog-reuse 2026-05-31).
# These live HERE (the manual override layer), NOT in the generated catalog:
# they are crs/aggregator relay aliases the LiteLLM-sourced `pnpm sync:catalog`
# artifact cannot know about, so a sync would wipe them. Keyed by the routing
# ALIAS (== the catalog modelKey the executor looks up; see execute.ts). Values
# are the curated, battle-tested data from the sibling **llm-router** project
# (`llm-router/config/providers.yaml` inline capabilities + provider-capabilities
# .generated.yaml) — single source of truth; keep in step when llm-router changes.
#
# NOTE: gpt-5.x on the la.atmy.work relay are STREAM-ONLY (non-stream → 400). That
# is a relay request constraint, NOT a capability gap — `supportsStreaming` stays
# true (the model DOES stream; it merely requires it). Default API usage streams.
openai-crs/gpt-5.5:
  supportsTools: true
  supportsJsonMode: true
  supportsVision: true
  supportsStreaming: true
  maxContextTokens: 1050000
  maxOutputTokens: 128000
