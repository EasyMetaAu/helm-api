# Observer compaction defaults. fixed/recent_keep=2 preserves current runtime
# behaviour. Switch mode to economy to use cache-aware dynamic compaction.
observer:
  compaction:
    mode: fixed
    recent_keep: 2

# Memory forgetting layer (docs/12). enabled:false = byte-identical to pre-docs/12
# behaviour; flip to true to turn on decay/reinforcement/facts. All knobs are
# fail-closed validated (snake_case, unknown keys refuse startup).
forgetting:
  enabled: true
  score:
    half_life_s: 86400
    importance_floor: 0.1
    importance_ceil: 1.0
    access_weight: 0.15
  inject:
    drop_order: score
  decay:
    archive_threshold: 0.05
    trigger_observations: 50
    trigger_interval_s: 3600
  consolidate:
    trigger_tokens: 1024
    max_facts_per_subject: 8
    enable_llm_supersede: false
  retention:
    archived_days: 30
    facts_expired_days: 90
  sweep:
    max_iterations: 200
    max_wallclock_s: 900
    max_consecutive_errors: 5
